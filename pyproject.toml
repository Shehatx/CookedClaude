[project]
name = "cookedclaude"
version = "0.1.0"
description = "A small AI coding agent that reads, writes, and runs Python files in a sandboxed working directory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.44.0",
    "python-dotenv==1.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
